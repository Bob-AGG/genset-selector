<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选型工具 - 发动机</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }

  .header { background: #1a365d; color: #fff; padding: 20px 40px; }
  .header h1 { font-size: 22px; }
  .header p { font-size: 13px; opacity: .7; margin-top: 4px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }

  .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card h2 { font-size: 16px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
  .card.full { grid-column: 1 / -1; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #4a5568; }
  .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a365d; box-shadow: 0 0 0 2px rgba(26,54,93,.2); }

  .radio-group { display: flex; gap: 16px; }
  .radio-group label { font-weight: 400; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .radio-group input[type="radio"] { width: auto; cursor: pointer; }

  .btn { background: #1a365d; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 15px; cursor: pointer; transition: background .2s; }
  .btn:hover { background: #2a4a7d; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .result-card { border-left: 4px solid #e2e8f0; }
  .result-card.pass { border-left-color: #22c55e; }
  .result-card.fail { border-left-color: #ef4444; }

  .result-ok { color: #22c55e; font-weight: 700; }
  .result-fail { color: #ef4444; font-weight: 700; }
  .result-warn { color: #f59e0b; font-weight: 700; }

  .engine-result { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .engine-result:last-child { border-bottom: none; }
  .engine-model { font-size: 16px; font-weight: 700; }
  .engine-spec { font-size: 13px; color: #666; margin-top: 2px; }
  .engine-power { display: flex; gap: 20px; margin-top: 6px; font-size: 13px; }
  .engine-power span { background: #f8fafc; padding: 2px 8px; border-radius: 4px; }

  .calc-detail { background: #f8fafc; border-radius: 6px; padding: 12px; margin-top: 8px; font-size: 13px; line-height: 1.6; }
  .calc-detail code { background: #e2e8f0; padding: 1px 5px; border-radius: 3px; font-size: 12px; }

  .stats { font-size: 13px; color: #666; margin-bottom: 12px; }
  .brand-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .header { padding: 16px; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  th { background: #f8fafc; font-weight: 600; }
  tr:hover { background: #f8fafc; }
  .tag-turbo { display:inline-block; background:#dbeafe; color:#1e40af; font-size:11px; padding:1px 6px; border-radius:3px; }
  .tag-na { display:inline-block; background:#fef3c7; color:#92400e; font-size:11px; padding:1px 6px; border-radius:3px; }
  .rule-box { background:#f0f9ff; border:1px solid #bae6fd; border-radius:6px; padding:10px; font-size:12px; line-height:1.7; margin-bottom:12px; }
  .brand-badge { display:inline-block; padding:1px 6px; border-radius:3px; font-size:11px; }
  .brand-dcec { background:#dcfce7; color:#166534; }
  .brand-cqc { background:#fef9c3; color:#854d0e; }
  .warn-badge { color:#d97706; font-weight:600; }
</style>
</head>
<body>

<div class="header">
  <h1>🔧 发电机组选型工具</h1>
  <p>v1.1 · 东康 DCEC + 重庆康明斯 CQCC</p>
</div>

<div class="container">
  <div class="card">
    <h2>📋 选型参数</h2>
    <div class="form-group">
      <label>品牌</label>
      <select id="brand" onchange="onBrandChange()">
        <option value="dcec">东康 DCEC (Cummins)</option>
        <option value="cqc">重庆康明斯 CQCC</option>
      </select>
    </div>
    <div class="rule-box" id="ruleDesc">加载中...</div>
    <div class="form-group">
      <label>频率</label>
      <select id="frequency">
        <option value="50Hz">50 Hz</option>
        <option value="60Hz">60 Hz</option>
      </select>
    </div>
    <div class="form-group">
      <label>额定功率 (kW)</label>
      <input type="number" id="power" value="400" min="10" max="5000" step="5">
    </div>
    <div class="form-group">
      <label>用途</label>
      <div class="radio-group">
        <label><input type="radio" name="purpose" value="ESP" checked> 备用 (ESP)</label>
        <label><input type="radio" name="purpose" value="PRP"> 常用 (PRP)</label>
      </div>
    </div>
    <div class="form-group">
      <label>安装海拔 (m)</label>
      <input type="number" id="altitude" value="0" min="0" max="5000" step="50">
    </div>
    <div class="form-group">
      <label>环境温度 (°C)</label>
      <input type="number" id="temperature" value="25" min="-10" max="60" step="1">
    </div>
    <button class="btn" onclick="doSearch()">🔍 查询选型</button>
  </div>

  <div class="card" id="resultPanel">
    <h2>📊 选型结果</h2>
    <div id="resultContent">
      <p style="color:#999;text-align:center;padding:30px 0">输入参数后点击「查询选型」</p>
    </div>
  </div>

  <div class="card full" id="debugPanel">
    <h2>🔎 全部候选型号</h2>
    <div id="debugContent">
      <p style="color:#999;">查询后显示所有候选及计算详情</p>
    </div>
  </div>
</div>

<script>
// ============ 发动机数据 ============
let ALL_ENGINES = [];
let DATA_LOADED = false;

// ============ 修正规则 ============
// 每个品牌的修正配置
const BRAND_CONFIG = {
  dcec: {
    name: '东康 DCEC',
    defaultRule: 'none',  // 默认不修正，仅以下机型有规则
    rules: [
      // { seriesMatch: function(series, model) { return true/false }, rule: {...} }
    ],
    // DCEC的规则：型号含T的涡轮增压机，共用一套规则
    getRule: function(model) {
      // 型号无T（自然吸气）不修正
      if (!/T/i.test(model) && !/^QS/i.test(model)) return null;
      // 涡轮增压：海拔>2000m每300m降4%，温度>40℃每10℃降3%
      return {
        altBase: 2000, altStep: 300, altDrop: 0.04,
        tempBase: 40, tempStep: 10, tempDrop: 0.03,
        hasRule: true, name: 'DCEC 涡轮增压标准'
      };
    }
  },
  cqc: {
    name: '重庆康明斯 CQCC',
    defaultRule: 'none',  // 默认不修正
    rules: [
      // NTA855系列 + NT855/NTAA855
      { match: /^(NT|NTA)/i, rule: { altBase:1525, altStep:300, altDrop:0.04, tempBase:40, tempStep:11, tempDrop:0.02, name:'NTA855 系列' } },
      // KTA19系列
      { match: /^KTA19/i, rule: { altBase:1525, altStep:300, altDrop:0.04, tempBase:40, tempStep:11, tempDrop:0.02, name:'KTA19 系列' } },
      // K38系列 (KTA38)
      { match: /^K38/i, rule: { altBase:1525, altStep:300, altDrop:0.04, tempBase:40, tempStep:11, tempDrop:0.02, name:'KTA38 系列' } },
      // K50系列 (KTA50)
      { match: /^K50/i, rule: { altBase:915, altStep:300, altDrop:0.04, tempBase:40, tempStep:11, tempDrop:0.16, name:'KTA50 系列' } }
    ],
    getRule: function(model) {
      for (const r of this.rules) {
        if (r.match.test(model)) return r.rule;
      }
      return null; // 无规则 → 不修正
    }
  }
};

// ============ 修正计算函数 ============
function calcCorrectionDCEC(model, altitude, temperature) {
  const rule = BRAND_CONFIG.dcec.getRule(model);
  if (!rule) {
    return { total: 1, altFactor: 1, tempFactor: 1, turbo: false, altDesc: '无修正（自然吸气/无规则）', tempDesc: '无修正', hasRule: false, ruleName: '-' };
  }
  return calcCorrectionGeneric(altitude, temperature, rule);
}

function calcCorrectionCQC(model, altitude, temperature) {
  const rule = BRAND_CONFIG.cqc.getRule(model);
  if (!rule) {
    return { total: 1, altFactor: 1, tempFactor: 1, turbo: false, altDesc: '⚠️ 无修正说明，暂不修正', tempDesc: '⚠️ 无修正说明，暂不修正', hasRule: false, ruleName: '无修正规则' };
  }
  return calcCorrectionGeneric(altitude, temperature, rule);
}

function calcCorrectionGeneric(altitude, temperature, rule) {
  const { altBase, altStep, altDrop, tempBase, tempStep, tempDrop } = rule;

  // 海拔修正
  let altFactor = 1;
  if (altitude > altBase) {
    const over = altitude - altBase;
    const steps = Math.floor(over / altStep);
    for (let i = 0; i < steps; i++) altFactor *= (1 - altDrop);
    const rem = over % altStep;
    if (rem > 0) altFactor *= (1 - altDrop * rem / altStep);
    altFactor = Math.round(altFactor * 1000) / 1000;
  }

  // 温度修正
  let tempFactor = 1;
  if (temperature > tempBase) {
    const over = temperature - tempBase;
    const steps = Math.floor(over / tempStep);
    for (let i = 0; i < steps; i++) tempFactor *= (1 - tempDrop);
    const rem = over % tempStep;
    if (rem > 0) tempFactor *= (1 - tempDrop * rem / tempStep);
    tempFactor = Math.round(tempFactor * 1000) / 1000;
  }

  const total = Math.round(altFactor * tempFactor * 1000) / 1000;

  let altDesc, tempDesc;
  if (altitude <= altBase) {
    altDesc = '海拔 ≤' + altBase + 'm，无需修正';
  } else {
    const pct = Math.round((1 - altFactor) * 1000) / 10;
    altDesc = '超过' + altBase + 'm，每' + altStep + 'm降' + (altDrop*100) + '%，降幅 ' + pct + '%';
  }
  if (temperature <= tempBase) {
    tempDesc = '温度 ≤' + tempBase + '℃，无需修正';
  } else {
    const pct = Math.round((1 - tempFactor) * 1000) / 10;
    tempDesc = '超过' + tempBase + '℃，每' + tempStep + '℃降' + (tempDrop*100) + '%，降幅 ' + pct + '%';
  }

  return { total, altFactor, tempFactor, turbo: true, altDesc, tempDesc, hasRule: true, ruleName: rule.name || '标准' };
}

function getCorrection(brand, model, altitude, temperature) {
  if (brand === 'dcec') return calcCorrectionDCEC(model, altitude, temperature);
  return calcCorrectionCQC(model, altitude, temperature);
}

// ============ 品牌切换 ============
function onBrandChange() {
  const brand = document.getElementById('brand').value;
  const cfg = BRAND_CONFIG[brand];
  const div = document.getElementById('ruleDesc');
  let html = '<b>' + cfg.name + ' 修正规则：</b><br>';

  if (brand === 'dcec') {
    html += '• 涡轮增压机型：海拔>2000m每300m降4%，温度>40℃每10℃降3%<br>';
    html += '• 自然吸气（型号无T）：不做修正';
  } else {
    html += '• 有修正规则的系列：NTA855、KTA19、KTA38、KTA50<br>';
    html += '• 其他系列（QSM11/M15/QSNT/QSK19/QSK38等）：暂不修正';
  }
  div.innerHTML = html;
}

// ============ 数据加载与查询 ============
async function loadData() {
  try {
    const resp = await fetch('engines.json');
    ALL_ENGINES = await resp.json();
    DATA_LOADED = true;
    console.log('Loaded', ALL_ENGINES.length, 'engines');
    onBrandChange();
  } catch(e) {
    console.warn('Failed to load engine data');
  }
}

function doSearch() {
  const power = parseFloat(document.getElementById('power').value);
  const freq = document.getElementById('frequency').value;
  const purpose = document.querySelector('input[name="purpose"]:checked').value;
  const altitude = parseFloat(document.getElementById('altitude').value);
  const temperature = parseFloat(document.getElementById('temperature').value);
  const brand = document.getElementById('brand').value;

  if (!power || power < 1) { alert('请输入有效功率'); return; }

  const cfg = BRAND_CONFIG[brand];

  // Filter engines by brand and frequency
  let filtered = ALL_ENGINES.filter(e =>
    e.brand === brand && e.frequency === freq
  );

  const candidates = [];
  for (const eng of filtered) {
    let ratedPower = 0;
    if (purpose === 'ESP') {
      ratedPower = eng.esp_kWe ? eng.esp_kWe : (eng.esp_kVA ? eng.esp_kVA * 0.8 : 0);
    } else {
      ratedPower = eng.prp_kWe ? eng.prp_kWe : (eng.prp_kVA ? eng.prp_kVA * 0.8 : 0);
    }
    if (ratedPower <= 0) continue;

    const correction = getCorrection(brand, eng.model, altitude, temperature);
    const correctedPower = ratedPower * correction.total;

    candidates.push({
      ...eng,
      ratedPower: Math.round(ratedPower),
      correctedPower: Math.round(correctedPower * 10) / 10,
      meets: correctedPower >= power,
      correction
    });
  }

  candidates.sort((a, b) => {
    if (a.meets && !b.meets) return -1;
    if (!a.meets && b.meets) return 1;
    return a.correctedPower - b.correctedPower;
  });

  displayResults(candidates, power, purpose, altitude, temperature, brand, cfg);
}

function displayResults(candidates, reqPower, purpose, altitude, temperature, brand, cfg) {
  const passing = candidates.filter(c => c.meets);
  const resultDiv = document.getElementById('resultContent');
  const debugDiv = document.getElementById('debugContent');
  const brandTag = brand === 'dcec' ? '东康' : '重庆康明斯';

  if (passing.length === 0) {
    let html = '<div class="result-card fail" style="padding:16px">' +
      '<div class="result-fail">❌ 未找到满足条件的型号（' + brandTag + '）</div>';
    if (candidates.length === 0) {
      html += '<p style="margin-top:10px;color:#666">当前品牌/频率下无可用发动机数据</p>';
    } else {
      const first = candidates[0];
      const c = first.correction;
      const minReq = Math.ceil(reqPower / c.total);
      html += '<div class="calc-detail">原始需求: ' + reqPower + 'kW ' + purpose + '<br>' +
        '— 修正计算说明 —<br>' +
        '🏔 ' + c.altDesc + '<br>🌡️ ' + c.tempDesc + '<br>' +
        (c.hasRule ? '<strong>综合系数: ×' + c.total + '</strong><br>所需额定功率 ≥ ' + minReq + 'kW' : '') +
        '</div>';
    }
    html += '</div>';
    resultDiv.innerHTML = html;
  } else {
    const top = passing.slice(0, 5);
    const best = top[0];
    const c = best.correction;
    const minReq = Math.ceil(reqPower / c.total);

    let html = '<div class="result-card pass" style="padding:12px">' +
      '<div class="result-ok" style="font-size:18px">✅ 推荐 ' + passing.length + ' 个可用型号</div>';

    if (c.hasRule && c.total !== 1) {
      html += '<div class="calc-detail" style="margin-top:10px">' +
        '<b>📐 修正计算过程</b><br>' +
        '修正规则: ' + c.ruleName + '<br>' +
        '🏔 ' + c.altDesc + '<br>🌡️ ' + c.tempDesc + '<br>' +
        '<strong>综合修正系数: ×' + c.total + '</strong><br>' +
        '所需额定功率 ≥ ' + minReq + 'kW</div>';
    } else {
      html += '<div class="calc-detail" style="margin-top:10px">' +
        '<b>📐 无需功率修正</b><br>' +
        (!c.hasRule ? '该机型无修正规则，按额定功率直接选型' : '海拔/温度未超基数，无需修正') +
        '</div>';
    }

    html += '<div class="engine-result" style="background:#f0fdf4;border-radius:6px;padding:10px;margin-top:10px">' +
      '<div class="engine-model">🏆 最佳推荐: ' + best.model + '</div>' +
      '<div class="engine-power"><span>📦 系列: ' + (best.series || '-') + '</span></div>' +
      '<div class="engine-power"><span>ESP: ' + (best.esp_kWe ? best.esp_kWe + 'kW' : (best.esp_kVA ? Math.round(best.esp_kVA*0.8) + 'kW' : '—')) + ' / ' + (best.esp_kVA ? best.esp_kVA + 'kVA' : '—') + '</span>' +
      '<span>PRP: ' + (best.prp_kWe ? best.prp_kWe + 'kW' : (best.prp_kVA ? Math.round(best.prp_kVA*0.8) + 'kW' : '—')) + ' / ' + (best.prp_kVA ? best.prp_kVA + 'kVA' : '—') + '</span></div>' +
      '<div class="engine-power" style="font-weight:600"><span class="result-ok">修正后: ' + best.correctedPower + 'kW ≥ ' + reqPower + 'kW ✅</span></div></div>';

    if (top.length > 1) {
      html += '<div style="margin-top:12px"><strong>其他可用型号:</strong></div>';
      for (let i = 1; i < top.length; i++) {
        const e = top[i];
        const ec = e.correction;
        const corrStr = ec.total !== 1 ? ('系数: ×' + ec.total) : '无修正';
        html += '<div class="engine-result"><div class="engine-model">' + e.model + '</div>' +
          '<div class="engine-power"><span>修正后: ' + e.correctedPower + 'kW</span><span>额定: ' + e.ratedPower + 'kW</span><span>' + corrStr + '</span></div></div>';
      }
    }
    html += '</div>';
    resultDiv.innerHTML = html;
  }

  // Debug table
  let dbg = '<div class="stats">' + brandTag + ' | 共 ' + candidates.length + ' 个, ' + passing.length + ' 个满足</div>';
  dbg += '<table><tr><th>型号</th><th>系列</th><th>ESP(kW)</th><th>PRP(kW)</th><th>修正后(kW)</th><th>系数</th><th>修正规则</th><th>结果</th></tr>';
  for (const e of candidates) {
    const cls = e.meets ? ' style="background:#f0fdf4"' : '';
    const ec = e.correction;
    dbg += '<tr' + cls + '><td><b>' + e.model + '</b></td>' +
      '<td>' + (e.series || '-') + '</td>' +
      '<td>' + (e.esp_kWe ? e.esp_kWe : (e.esp_kVA ? Math.round(e.esp_kVA*0.8) : '-')) + '</td>' +
      '<td>' + (e.prp_kWe ? e.prp_kWe : (e.prp_kVA ? Math.round(e.prp_kVA*0.8) : '-')) + '</td>' +
      '<td><b>' + e.correctedPower + '</b></td>' +
      '<td>' + (ec.total !== 1 ? '×' + ec.total : '1.000') + '</td>' +
      '<td>' + (ec.hasRule ? ec.ruleName : (ec.turbo ? '有涡轮' : '无修正')) + '</td>' +
      '<td>' + (e.meets ? '✅' : '❌') + '</td></tr>';
  }
  dbg += '</table>';
  debugDiv.innerHTML = dbg;
}

loadData();
</script>
</body>
</html>
