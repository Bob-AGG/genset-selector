<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发电机选型工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333}
.header{background:#1a365d;color:#fff;padding:20px 40px}
.header h1{font-size:22px}
.header p{font-size:13px;opacity:.7}
.page{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:320px 1fr;grid-template-areas:"left right" "bottom bottom"}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card h2{font-size:15px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
.left-area{grid-area:left;align-self:start}
.right-area{grid-area:right;align-self:start}
.bottom-area{grid-area:bottom}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:2px;color:#4a5568}
.form-group input,.form-group select{width:100%;padding:6px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:13px;background:#fff}
.radio-group{display:flex;gap:10px;margin:3px 0}
.radio-group label{font-weight:400;font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer}
.radio-group input[type=radio]{width:auto;cursor:pointer}
.btn{background:#1a365d;color:#fff;border:none;padding:8px 18px;border-radius:5px;font-size:14px;cursor:pointer;width:100%;margin-top:2px}
.btn:hover{background:#2a4a7d}
.tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:11px}
.calc-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.7}
.calc-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0}
.calc-row:last-child{border:0}
.calc-label{color:#666}
.calc-val{font-weight:600}
.calc-total{color:#1a365d;font-size:14px}
.match-card{background:#f0fff4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:8px}
.match-card .model{font-size:16px;font-weight:700;margin-bottom:4px}
.match-card .params{font-size:13px;line-height:1.7}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}
th{background:#f8fafc;font-weight:600;position:sticky;top:0}
tr.ok{background:#f0fff4}
tr.fail{opacity:.55}
tr:hover{background:#f0f2f5}
.rank{color:#888;font-size:11px}
.stats{font-size:12px;color:#888;margin-bottom:6px}
@media(max-width:800px){.page{grid-template-columns:1fr;grid-template-areas:"left" "right" "bottom"}}
</style>
</head>
<body>
<div class="header">
<h1>⚡ 发电机选型工具</h1>
<p>利莱森玛 · 康明斯</p>
</div>
<div class="page">
<div class="card left-area">
<div class="form-group"><label>电机品牌</label><select id="genBrand"><option value="leroysomer">利莱森玛</option></select></div>
<div class="form-group"><label>额定电压（接线方式）</label><select id="genWinding"><option value="">请先选择频率</option></select></div>
<div class="form-group"><label>频率</label>
  <div class="radio-group">
    <label><input type="radio" name="genFreq" value="50Hz" checked onchange="onFreqChange()"> 50 Hz</label>
    <label><input type="radio" name="genFreq" value="60Hz" onchange="onFreqChange()"> 60 Hz</label>
  </div>
</div>
<div class="form-group"><label>用途</label>
  <div class="radio-group">
    <label><input type="radio" name="genPurpose" value="PRIME" checked> 主用</label>
    <label><input type="radio" name="genPurpose" value="STANDBY"> 备用</label>
  </div>
</div>
<div class="form-group"><label>额定功率 (kVA)</label><input type="number" id="genPower" value="100" min="5" max="500" step="5"></div>
<div class="form-group"><label>安装海拔 (m)</label><input type="number" id="genAlt" value="0" min="0" max="4000" step="100"></div>
<div class="form-group"><label>环境温度 (°C)</label><input type="number" id="genTemp" value="25" min="0" max="60" step="1"></div>
<div class="form-group"><label>功率因数 (PF)</label><select id="genPF"><option value="0.8">0.8</option><option value="0.9">0.9</option><option value="1.0">1.0</option></select></div>
<button class="btn" onclick="doSearch()">🔍 查询</button>
</div>

<div class="card right-area">
<h2>📐 计算过程</h2>
<div id="calcDisplay">选择参数后点击查询</div>
<div id="matchDisplay"></div>
</div>

<div class="card bottom-area">
<h2>📋 全部候选</h2>
<div id="listDisplay">查询后显示候选列表</div>
</div>
</div>

<script>
var ALL_DATA = [];

function onFreqChange(){
  var f=document.querySelector('input[name="genFreq"]:checked').value;
  var ws=document.getElementById('genWinding');
  if(f==='50Hz'){
    ws.innerHTML='<option value="6-380">Y 380 / Δ 220 / YY 190V</option><option value="6-400">Y 400 / Δ 230 / YY 200V</option><option value="6-415">Y 415 / Δ 240 / YY 208V</option><option value="6-440">Y 440 / Δ 254 / YY 220V</option>';
  } else {
    ws.innerHTML='<option value="6-380">Y 380 / Δ 220 / YY 190V</option><option value="6-416">Y 416 / Δ 240 / YY 208V</option><option value="6-440">Y 440 / Δ 254 / YY 220V</option><option value="6-480">Y 480 / Δ 277 / YY 240V</option>';
  }
}

function getAF(a){
  if(a<=0)return 1;if(a<=1000)return 1;if(a<=1500)return 0.975;
  if(a<=2000)return 0.949;if(a<=2500)return 0.922;if(a<=3000)return 0.894;
  if(a<=3500)return 0.866;if(a<=4000)return 0.837;return 0.837;
}

function doSearch(){
  var f=document.querySelector('input[name="genFreq"]:checked').value;
  var w=document.getElementById('genWinding').value;
  var u=document.querySelector('input[name="genPurpose"]:checked').value;
  var p=Number(document.getElementById('genPower').value);
  var a=Number(document.getElementById('genAlt').value);
  var t=Number(document.getElementById('genTemp').value);
  var pfUser=parseFloat(document.getElementById('genPF').value);

  if(!w){alert('请选电压');return;}
  if(!p||p<1){alert('请输入功率');return;}

  var af=getAF(a);
  var tf=t<=40?1:0.8;
  var tot=Math.round(af*tf*1000)/1000;
  var is1ph=w.indexOf('1ph-')===0;
  var list=[];

  for(var i=0;i<ALL_DATA.length;i++){
    var g=ALL_DATA[i];
    if(g.type!=='generator'||g.frequency!==f||g.winding_code!==w) continue;
    if(!is1ph && pfUser!==g.pf) continue;
    var uKey=is1ph?'kW':'kVA';
    var r=u==='PRIME'?g['cont_h_'+uKey]:g['stdby_27c_'+uKey];
    if(!r||r<=0) continue;
    var cp=Math.round(r*tot*10)/10;
    list.push({m:g.model,ch:g['cont_h_'+uKey],cl:g['cont_f_'+uKey]||0,s40:g['stdby_40c_'+uKey]||0,st:g['stdby_27c_'+uKey],cp:cp,ok:cp>=p,af:af,tf:tf,pf:g.pf,uk:uKey});
  }

  list.sort(function(a,b){
    if(a.ok!==b.ok) return a.ok?-1:1;
    return Math.abs(a.cp-p)-Math.abs(b.cp-p);
  });

  var top=null;
  for(var i=0;i<list.length;i++){if(list[i].ok){top=list[i];break;}}

  var un=u==='PRIME'?'主用':'备用';
  var ux=is1ph?'kW':'kVA';

  // 计算过程
  var ch='<div class="calc-box">';
  ch+='<div class="calc-row"><span class="calc-label">频率 / 用途</span><span class="calc-val">'+f+' / '+un+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">功率因数 PF</span><span class="calc-val">'+(is1ph?'1.0（单相机固定）':pfUser)+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">用户需求功率</span><span class="calc-val">'+p+' kVA</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">海拔修正</span><span class="calc-val">'+a+'m → 系数 ×'+af+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">温度修正</span><span class="calc-val">'+t+'°C → 系数 ×'+tf+'</span></div>';
  ch+='<div class="calc-row" style="border:0"><span class="calc-label"><b>综合修正系数</b></span><span class="calc-val calc-total"><b>×'+tot+'</b></span></div>';
  if(top){
    ch+='<div class="calc-row"><span class="calc-label">基准功率（'+(u=='PRIME'?'持续H':'备用27°C')+'）</span><span class="calc-val">'+top.ch+ux+'</span></div>';
    ch+='<div class="calc-row" style="border:0"><span class="calc-label"><b>修正后功率</b></span><span class="calc-val calc-total"><b>'+top.ch+' × '+tot+' = '+top.cp+ux+'</b></span></div>';
  }
  ch+='</div>';

  // 最佳匹配
  var mh='';
  if(top){
    mh+='<div class="match-card"><div class="model">'+top.m+' <span class="tag">推荐</span></div>';
    mh+='<div class="params"><span>PF='+top.pf+'</span> <span>持续H: '+top.ch+top.uk+'</span> <span>连续F: '+top.cl+top.uk+'</span> <span>备用40°C: '+top.s40+top.uk+'</span> <span>备用27°C: '+top.st+top.uk+'</span><br>';
    mh+='修正后: <b>'+top.cp+top.uk+'</b> ≥ '+p+'kVA ✅</div></div>';
  } else {
    mh+='<div class="match-card" style="background:#fff5f5;border-color:#fecaca"><div class="model">❌ 无匹配</div></div>';
  }

  // 全部候选表
  var lh='';
  if(list.length){
    var okCount=list.filter(function(x){return x.ok;}).length;
    lh+='<div class="stats">共'+list.length+'款，'+okCount+'款满足需求</div><div class="table-wrap"><table>';
    lh+='<tr><th>#</th><th>型号</th><th>持续H('+ux+')</th><th>连续F('+ux+')</th><th>备用40°C('+ux+')</th><th>备用27°C('+ux+')</th><th>PF</th><th>判断</th></tr>';
    for(var i=0;i<list.length;i++){
      var x=list[i];
      var rank=(x.ok?list.filter(function(y,idx){return idx<i&&y.ok;}).length+1:'-');
      lh+='<tr class="'+(x.ok?'ok':'fail')+'"><td>'+(x.ok?rank:'✗')+'</td><td><b>'+x.m+'</b></td><td>'+x.ch+'</td><td>'+x.cl+'</td><td>'+x.s40+'</td><td>'+x.st+'</td><td>'+x.pf+'</td><td>'+(x.ok?'✅':'❌')+'</td></tr>';
    }
    lh+='</table></div>';
  }

  document.getElementById('calcDisplay').innerHTML=ch;
  document.getElementById('matchDisplay').innerHTML=mh;
  document.getElementById('listDisplay').innerHTML=lh||'<div>未找到</div>';
}

onFreqChange();
fetch('engines.json').then(function(r){return r.json();}).then(function(d){
  ALL_DATA=d;
  onFreqChange();
  document.getElementById('calcDisplay').innerHTML='<div style="font-size:13px;color:#888">✅ 数据已加载：共 '+d.length+' 条</div>';
}).catch(function(e){
  document.getElementById('calcDisplay').innerHTML='<div style="color:red">❌ 加载失败</div>';
});
</script>
</body>
</html>
