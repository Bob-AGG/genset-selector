<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发电机选型工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333}
.header{background:#1a365d;color:#fff;padding:20px 40px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;cursor:pointer}
.header h1:hover{opacity:.8}
.header p{font-size:13px;opacity:.7}
.nav{display:flex;gap:6px}
.nav a{color:#94a3b8;text-decoration:none;font-size:13px;padding:6px 14px;border-radius:4px;cursor:pointer}
.nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav a.active{color:#fff;background:rgba(255,255,255,.15)}

.page{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:340px 1fr;grid-template-areas:"left right" "bottom bottom"}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card h2{font-size:15px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
.left-area{grid-area:left;align-self:start}
.right-area{grid-area:right;align-self:start}
.bottom-area{grid-area:bottom}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:2px;color:#4a5568}
.form-group input,.form-group select{width:100%;padding:6px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:13px;background:#fff}
.radio-group{display:flex;gap:10px;margin:3px 0}
.radio-group label{font-weight:400;font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer}
.radio-group input[type=radio]{width:auto;cursor:pointer}
.btn{background:#1a365d;color:#fff;border:none;padding:8px 18px;border-radius:5px;font-size:14px;cursor:pointer;width:100%;margin-top:2px}
.btn:hover{background:#2a4a7d}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.btn-secondary{background:#e2e8f0;color:#333;border:none;padding:6px 14px;border-radius:5px;font-size:13px;cursor:pointer}
.btn-secondary:hover{background:#cbd5e1}

.calc-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.7}
.calc-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0}
.calc-row:last-child{border:0}
.calc-label{color:#666}
.calc-val{font-weight:600}
.calc-total{color:#1a365d;font-size:14px}

.match-card{background:#f0fff4;border:1px solid #bbf7d0;border-radius:8px;padding:14px;margin-top:8px}
.match-card .model{font-size:17px;font-weight:700;margin-bottom:6px}
.match-card .model .badge{display:inline-block;background:#16a34a;color:#fff;font-size:11px;padding:1px 7px;border-radius:3px;margin-left:6px;vertical-align:middle}
.match-card .params{font-size:13px;line-height:1.8}
.match-card .params .tag{display:inline-block;background:#dcfce7;color:#166534;padding:1px 6px;border-radius:3px;margin:1px}
.match-card.no-match{background:#fff5f5;border-color:#fecaca}
.match-card.no-match .model{color:#dc2626}

.step-panel{margin-top:8px}
.step-header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;cursor:pointer;font-size:13px;margin-bottom:4px}
.step-header:hover{background:#f1f5f9}
.step-header .step-num{font-weight:700;color:#1a365d;margin-right:8px}
.step-header .step-desc{flex:1;color:#475569}
.step-header .step-result{font-weight:600;color:#1a365d}
.step-header .arrow{color:#94a3b8;font-size:11px;transition:transform .2s}
.step-header.open .arrow{transform:rotate(180deg)}
.step-body{display:none;padding:8px 10px;background:#fff;border:1px solid #e2e8f0;border-top:0;border-radius:0 0 5px 5px;font-size:13px;margin-bottom:4px}
.step-body.open{display:block}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}
th{background:#f8fafc;font-weight:600;position:sticky;top:0}
tr.ok{background:#f0fff4}
tr.fail{opacity:.55}
tr:hover{background:#f0f2f5}
.stats{font-size:12px;color:#888;margin-bottom:6px}

.landing{text-align:center;padding:40px 20px;color:#94a3b8}
.landing .icon{font-size:48px;margin-bottom:12px}
.landing p{font-size:14px;line-height:1.8}

@media(max-width:800px){.page{grid-template-columns:1fr;grid-template-areas:"left" "right" "bottom"}.header{flex-direction:column;gap:10px}.nav{flex-wrap:wrap;justify-content:center}}
</style>
</head>
<body>
<div class="header">
<div><h1 onclick="switchView('home')">⚡ 发电机选型工具</h1><p>利莱森玛 · 斯坦福 · 马拉松 · 英格</p></div>
<div class="nav">
<a class="active" onclick="switchView('selector')">发电机选型</a>
<a onclick="switchView('browse')">产品库</a>
<a onclick="switchView('tools')">工具</a>
<a onclick="switchView('help')">帮助</a>
</div>
</div>

<div class="page" id="selectorView">
<div class="card left-area">
<h2>📋 选型参数</h2>
<div class="form-group"><label>电机品牌</label><select id="genBrand"><option value="">请选择品牌</option></select></div>
<div class="form-group"><label>额定电压（接线方式）</label><select id="genWinding"><option value="">请先选择品牌和频率</option></select></div>
<div class="form-group"><label>频率</label><div class="radio-group">
<label><input type="radio" name="genFreq" value="50Hz" checked onchange="onParamChange()"> 50 Hz</label>
<label><input type="radio" name="genFreq" value="60Hz" onchange="onParamChange()"> 60 Hz</label>
</div></div>
<div class="form-group"><label>用途</label><div class="radio-group">
<label><input type="radio" name="genDuty" value="PRP" checked> 主用 PRP</label>
<label><input type="radio" name="genDuty" value="LTP"> 备用 LTP</label>
</div></div>
<div class="form-group"><label>额定功率</label><input type="number" id="genPower" value="100" min="1" max="99999" step="5">
<div class="radio-group" style="margin-top:3px">
<label><input type="radio" name="powerUnit" value="kW" checked onchange="onUnitChange()"> kW</label>
<label><input type="radio" name="powerUnit" value="kVA" onchange="onUnitChange()"> kVA</label>
</div></div>
<div class="form-group"><label>安装海拔 (m)</label><input type="number" id="genAlt" value="0" min="0" max="5000" step="100"></div>
<div class="form-group"><label>环境温度 (°C)</label><input type="number" id="genTemp" value="25" min="-20" max="60" step="1"></div>
<div class="form-group"><label>功率因数 PF</label><select id="genPF"><option value="0.8">0.8</option><option value="0.85">0.85</option><option value="0.9">0.9</option><option value="1.0">1.0</option></select></div>
<button class="btn" id="searchBtn" onclick="doSearch()">🔍 查询</button>
</div>

<div class="card right-area">
<h2>🏆 最佳匹配</h2>
<div id="matchDisplay"><div class="landing"><div class="icon">🔍</div><p>填写左侧参数后点击「查询」<br>系统将自动计算并推荐最佳匹配电机</p></div></div>
</div>

<div class="card bottom-area">
<h2>📊 计算过程</h2>
<div id="calcDisplay"></div>
<h2 style="margin-top:16px">📋 全部候选</h2>
<div id="listDisplay"></div>
</div>
</div>

<div class="page" id="browseView" style="display:none">
<div class="card" style="grid-column:1/-1">
<h2>📦 产品库</h2>
<div class="landing"><div class="icon">📦</div><p>品牌产品数据接入后可在此浏览</p></div>
</div>
</div>

<div class="page" id="toolsView" style="display:none">
<div class="card" style="grid-column:1/-1">
<h2>🔧 工具</h2>
<div class="landing"><div class="icon">🔧</div><p>功率换算 · 环境修正 · 接线方式说明 · 排放标准速查</p></div>
</div>
</div>

<div class="page" id="helpView" style="display:none">
<div class="card" style="grid-column:1/-1">
<h2>❓ 帮助文档</h2>
<div class="landing"><div class="icon">❓</div><p>选型指南 · 常见问题 · 技术标准</p></div>
</div>
</div>

<script>
var ALL_DATA = {};  // 按品牌分：{ brand: [record,...] }

function switchView(v){
  document.querySelectorAll('.nav a').forEach(function(a){a.className='';});
  document.querySelectorAll('.page').forEach(function(p){p.style.display='none';});
  var nav={'home':'selector','selector':'selector','browse':'browse','tools':'tools','help':'help'};
  document.getElementById(nav[v]+'View').style.display='grid';
  document.querySelector('.nav a[onclick*="'+v+'"]').className='active';
}

function onUnitChange(){
  var unit=document.querySelector('input[name="powerUnit"]:checked').value;
  document.getElementById('genPower').step=unit==='kW'?5:5;
}

function onParamChange(){
  var brand=document.getElementById('genBrand').value;
  var freq=document.querySelector('input[name="genFreq"]:checked').value;
  var ws=document.getElementById('genWinding');
  if(!brand||!freq){ws.innerHTML='<option value="">请先选择品牌和频率</option>';return;}
  // 根据已加载的品牌数据动态生成电压选项
  var records=ALL_DATA[brand]||[];
  var windings=[];
  for(var i=0;i<records.length;i++){
    var r=records[i];
    if(r.frequency===freq && windings.indexOf(r.winding_code)===-1){
      windings.push(r.winding_code);
    }
  }
  if(windings.length===0){
    ws.innerHTML='<option value="">该品牌无'+freq+'数据</option>';
    return;
  }
  ws.innerHTML='<option value="">请选择电压</option>';
  var added={};
  for(var i=0;i<windings.length;i++){
    var w=windings[i];
    if(added[w]) continue;
    added[w]=true;
    // 从数据中找第一条记录获取 winding_label
    var label=w;
    for(var j=0;j<records.length;j++){
      if(records[j].frequency===freq && records[j].winding_code===w && records[j].winding_label){
        label=records[j].winding_label;
        break;
      }
    }
    ws.innerHTML+='<option value="'+w+'">'+label+'</option>';
  }
}

// 利莱森玛 LSA 海拔修正系数（底层逻辑，不可变）
var ALT_FACTOR=[
  {max:1000,val:1},{max:1500,val:0.975},{max:2000,val:0.949},
  {max:2500,val:0.922},{max:3000,val:0.894},{max:3500,val:0.866},{max:4000,val:0.837}
];
function getTempFactor(t,grade){
  var tbl={'H':TEMP_FACTOR_H,'F':TEMP_FACTOR_F,'B':TEMP_FACTOR_B}[grade]||TEMP_FACTOR_H;
  if(t<=0)return tbl[tbl.length-1].val;
  for(var i=0;i<tbl.length;i++){if(t<=tbl[i].max)return tbl[i].val;}
  return tbl[tbl.length-1].val;
}
function getAF(a){
  if(a<=0)return 1;
  for(var i=0;i<ALT_FACTOR.length;i++){if(a<=ALT_FACTOR[i].max)return ALT_FACTOR[i].val;}
  return 0.837;
}

// ===== 斯坦福(STAMFORD) 修正规则（底层逻辑，不可变；2026-07-31 用户确认）=====
// 海拔修正（仅低压 <690V 适用；已推送斯坦福数据全部为低压）
var ST_ALT_FACTOR=[
  {max:1000,val:1},{max:1500,val:0.97},{max:2000,val:0.94},
  {max:2500,val:0.91},{max:3000,val:0.88},{max:3500,val:0.85},{max:4000,val:0.82}
];
// 温度修正（40°C 及以下不降额=1.0；40-45°C 区间按 45°C 档修正）
// S0-S7 系列：单列
var ST_TEMP_S=[
  {max:45,val:0.97},{max:50,val:0.94},{max:55,val:0.91},{max:60,val:0.88}
];
// P80 & S9 系列：CLASS H/F/B 三列（选型以 cont_h 为基准，取 H 列）
var ST_TEMP_PF_H=[
  {max:45,val:0.970},{max:50,val:0.940},{max:55,val:0.910},{max:60,val:0.880}
];
// 斯坦福温度系数：40°C 及以下=1.0；40-45°C 区间 = 45°C 档；45°C 起按表降额
// 官方表 P80&S9 的 CLASS H 列与 S 系列单列数值一致（45:0.97/50:0.94/55:0.91/60:0.88），
// 选型以 cont_h(H级) 为基准，统一取 H 列。
function getStanfordTemp(t){
  if(t<=40) return 1;
  if(t<45) return 0.97;      // 40-45°C 区间：按 45°C 档
  if(t<50) return 0.97;
  if(t<55) return 0.94;
  if(t<60) return 0.91;
  return 0.88;               // ≥60°C（最高档）
}
// 斯坦福海拔系数（仅低压；已推送斯坦福全为 ≤690V 低压）
function getStanfordAF(a){
  if(a<=0) return 1;
  for(var i=0;i<ST_ALT_FACTOR.length;i++){if(a<=ST_ALT_FACTOR[i].max)return ST_ALT_FACTOR[i].val;}
  return 0.82;
}

// 利莱森玛 LSA 温度修正系数表（底层逻辑，不可变）
// 40°C 基准，按温升等级查表
var TEMP_FACTOR_H=[  // H级
  {max:25,val:1.076},{max:40,val:1},{max:45,val:0.973},{max:50,val:0.946},
  {max:55,val:0.918},{max:60,val:0.889}
];
var TEMP_FACTOR_F=[  // F级
  {max:25,val:1.095},{max:40,val:1},{max:45,val:0.966},{max:50,val:0.931},
  {max:55,val:0.894},{max:60,val:0.856}
];
var TEMP_FACTOR_B=[  // B级
  {max:25,val:1.14},{max:40,val:1},{max:45,val:0.949},{max:50,val:0.894},
  {max:55,val:0.837},{max:60,val:0.775}
];

// 滞后功率因数修正系数（底层逻辑，不可变）
function getPFFactor(pf){
  if(pf<=0.6)return 0.86;
  if(pf<=0.7)return 0.93;
  return 1;
}

function doSearch(){
  var brand=document.getElementById('genBrand').value;
  var w=document.getElementById('genWinding').value;
  var freq=document.querySelector('input[name="genFreq"]:checked').value;
  var duty=document.querySelector('input[name="genDuty"]:checked').value;
  var unit=document.querySelector('input[name="powerUnit"]:checked').value;
  var p=Number(document.getElementById('genPower').value);
  var a=Number(document.getElementById('genAlt').value);
  var t=Number(document.getElementById('genTemp').value);
  var pfUser=parseFloat(document.getElementById('genPF').value);

  if(!brand){alert('请选品牌');return;}
  if(!w){alert('请选电压');return;}
  if(!p||p<1){alert('请输入功率');return;}

  var records=ALL_DATA[brand]||[];
  var is1ph=w.indexOf('1ph-')===0;
  // 中高压品牌：不适用海拔/温度修正，按默认海拔(≤1000m→af=1)和默认温度(40℃→tf=1)选型，忽略用户输入的数值
  var isHV=(brand==='利莱森玛 LSA 中高压');
  var targetKVA=unit==='kW'?Math.round(p/pfUser*10)/10:p;

  // 步骤1：解析
  var ch='<div class="step-panel">';
  ch+='<div class="step-header" onclick="toggleStep(this)"><span><span class="step-num">步骤1</span>解析输入</span><span class="step-desc">用户输入 → 目标kVA</span><span class="step-result">'+targetKVA+' kVA</span><span class="arrow">▼</span></div>';
  ch+='<div class="step-body"><div class="calc-row"><span class="calc-label">输入功率</span><span class="calc-val">'+p+' '+unit+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">功率因数 PF</span><span class="calc-val">'+pfUser+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">目标 kVA</span><span class="calc-val">'+targetKVA+' kVA</span></div></div>';

  // 步骤2：温度修正（按品牌选系数源。LSA用原有H级40°C基准；斯坦福用官方表；中高压不适用，按默认40°C选型）
  var isStanford = (brand==='斯坦福');
  var tf = isHV ? 1 : (isStanford ? getStanfordTemp(t) : getTempFactor(t,'H'));
  ch+='<div class="step-header" onclick="toggleStep(this)"><span><span class="step-num">步骤2</span>温度修正</span><span class="step-desc">'+(isHV?'中高压不适用（按默认40℃选型）':(t+'℃ → '+(isStanford?'斯坦福':'H级')+'修正系数'))+'</span><span class="step-result">×'+tf+'</span><span class="arrow">▼</span></div>';
  ch+='<div class="step-body"><div class="calc-row"><span class="calc-label">安装温度</span><span class="calc-val">'+(isHV?'中高压不适用（界面输入不生效）':t+'℃')+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">基准温度</span><span class="calc-val">'+(isHV?'默认40℃（中高压不降额）':(isStanford?(t<=40?'40℃(以下不降额)':'40℃(40-45℃按45℃档)'):'40℃'))+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">修正系数'+(isHV?'':(isStanford?'':'（H级）'))+'</span><span class="calc-val">×'+tf+'</span></div></div>';

  // 步骤3：海拔修正（斯坦福仅低压<690V；已推送斯坦福全低压；LSA用原有表；中高压不适用，按默认≤1000m选型）
  var af = isHV ? 1 : (isStanford ? getStanfordAF(a) : getAF(a));
  ch+='<div class="step-header" onclick="toggleStep(this)"><span><span class="step-num">步骤3</span>海拔温升修正</span><span class="step-desc">'+(isHV?'中高压不适用（按默认≤1000m选型）':(a+'m → 降额系数'))+'</span><span class="step-result">×'+af+'</span><span class="arrow">▼</span></div>';
  ch+='<div class="step-body"><div class="calc-row"><span class="calc-label">安装海拔</span><span class="calc-val">'+(isHV?'中高压不适用（界面输入不生效）':a+'m')+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">降额系数</span><span class="calc-val">×'+af+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">综合修正</span><span class="calc-val calc-total">'+af+'×'+tf+' = ×'+Math.round(af*tf*1000)/1000+'</span></div></div>';

  var tot=Math.round(af*tf*1000)/1000;

  var list=[];
  for(var i=0;i<records.length;i++){
    var g=records[i];
    if(g.frequency!==freq||g.winding_code!==w) continue;
    var uKey=is1ph?'kW':'kVA';
    var r=duty==='PRP'?g['cont_h_'+uKey]:g['stdby_27c_'+uKey];
    if(!r||r<=0) continue;
    var cp=Math.round(r*tot*10)/10;
    list.push({m:g.model,ch:g['cont_h_'+uKey],cl:g['cont_f_'+uKey]||0,s40:g['stdby_40c_'+uKey]||0,st:g['stdby_27c_'+uKey],cp:cp,ok:cp>=targetKVA,af:af,tf:tf,pf:g.pf,uk:uKey,exc:g.exc_std||'',grade:g.temp_grade||''});
  }

  // 步骤4-5：温升校核 + 备用换算（在列表结果中显示）
  var hOkCount=list.filter(function(x){return x.ok;}).length;
  ch+='<div class="step-header" onclick="toggleStep(this)"><span><span class="step-num">步骤4</span>温升校核</span><span class="step-desc">H级/F级可用功率</span><span class="step-result">'+list.length+'款</span><span class="arrow">▼</span></div>';
  ch+='<div class="step-body">';
  ch+='<div class="calc-row"><span class="calc-label">总候选电机</span><span class="calc-val">'+list.length+'款</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">满足需求（修正后）</span><span class="calc-val">'+hOkCount+'款</span></div></div>';

  ch+='<div class="step-header" onclick="toggleStep(this)"><span><span class="step-num">步骤5</span>备用换算</span><span class="step-desc">备用功率校核</span><span class="step-result">'+(duty==='PRP'?'主用模式':'备用模式')+'</span><span class="arrow">▼</span></div>';
  ch+='<div class="step-body"><div class="calc-row"><span class="calc-label">工作制</span><span class="calc-val">'+duty+'</span></div>';
  ch+='<div class="calc-row"><span class="calc-label">基准功率取值</span><span class="calc-val">'+(duty==='PRP'?'持续H / 125K':'备用27℃ / 163K')+'</span></div></div>';

  // 排序：中高压 → 先F级在前、H级在后（按温升等级），同级内再按ok优先+接近度；其它品牌 → 保持原逻辑
  list.sort(function(a,b){
    if(isHV){
      var ga=(a.grade==='F'?0:1), gb=(b.grade==='F'?0:1);
      if(ga!==gb) return ga-gb;
    }
    if(a.ok!==b.ok) return a.ok?-1:1;
    return Math.abs(a.cp-targetKVA)-Math.abs(b.cp-targetKVA);
  });

  // 步骤6：最佳匹配
  var top=null;
  for(var i=0;i<list.length;i++){if(list[i].ok){top=list[i];break;}}

  ch+='<div class="step-header '+(top?'':'')+'" onclick="toggleStep(this)"><span><span class="step-num">步骤6</span>综合判定</span><span class="step-desc">'+(top?'✅ 推荐 '+top.m:'❌ 无匹配')+'</span><span class="step-result">'+(top?top.cp+top.uk+'/'+targetKVA+'kVA':'-')+'</span><span class="arrow">▼</span></div>';
  ch+='<div class="step-body">';
  if(top){
    ch+='<div class="calc-row"><span class="calc-label">最佳型号</span><span class="calc-val"><b>'+top.m+(isHV&&top.grade?'（'+top.grade+'级温升）':'')+'</b></span></div>';
    ch+='<div class="calc-row"><span class="calc-label">基准功率</span><span class="calc-val">'+top.ch+top.uk+(isHV&&top.grade?'（'+top.grade+'级）':'')+'</span></div>';
    ch+='<div class="calc-row"><span class="calc-label">修正后功率</span><span class="calc-val calc-total">'+top.ch+' × '+tot+' = <b>'+top.cp+top.uk+'</b>'+(isHV?'（中高压无修正）':'')+'</span></div>';
    ch+='<div class="calc-row"><span class="calc-label">需求功率</span><span class="calc-val">'+targetKVA+' kVA</span></div>';
    ch+='<div class="calc-row"><span class="calc-label">判定</span><span class="calc-val" style="color:green">✅ 满足</span></div>';
  } else {
    ch+='<div class="calc-row"><span class="calc-label">判定</span><span class="calc-val" style="color:red">❌ 无电机满足需求</span></div>';
  }
  ch+='</div></div>';

  document.getElementById('calcDisplay').innerHTML=ch;

  // 最佳匹配卡片
  var ux=is1ph?'kW':'kVA';
  var mh='';
  if(top){
    mh+='<div class="match-card"><div class="model">'+top.m+(isHV&&top.grade?' <span class="badge">'+top.grade+'级</span>':' <span class="badge">推荐</span>')+'</div>';
    mh+='<div class="params">';
    if(isHV) mh+='<span class="tag">温升: '+top.grade+'级（'+top.grade+'级温升选型）</span> ';
    mh+='<span class="tag">PF='+top.pf+'</span> ';
    mh+='<span class="tag">持续'+(isHV?top.grade:'H')+': '+top.ch+ux+'</span> ';
    mh+='<span class="tag">备用40℃: '+top.s40+ux+'</span> ';
    mh+='<span class="tag">备用27℃: '+top.st+ux+'</span> ';
    mh+='<span class="tag">励磁: '+top.exc+'</span><br>';
    mh+='<div style="margin-top:8px"><b>修正后: '+top.cp+ux+'</b> ≥ '+targetKVA+'kVA ✅'+(isHV?'（无海拔/温度修正）':'')+'</div>';
    mh+='<div style="margin-top:8px;display:flex;gap:6px">';
    mh+='<button class="btn-secondary" onclick="alert(\'导出功能待实现\')">📄 导出PDF</button>';
    mh+='<button class="btn-secondary" onclick="location.reload()">🔄 新建查询</button>';
    mh+='</div></div></div>';
  } else {
    mh+='<div class="match-card no-match"><div class="model">❌ 无匹配电机</div>';
    mh+='<div class="params">没有电机能满足修正后 '+targetKVA+'kVA 的需求<br>建议降低功率、放宽PF或增加品牌数据。</div></div>';
  }
  document.getElementById('matchDisplay').innerHTML=mh;

  // 全部候选表
  var lh='';
  if(list.length){
    var okCnt=list.filter(function(x){return x.ok;}).length;
    lh+='<div class="stats">共'+list.length+'款，'+okCnt+'款满足'+(isHV?'（F级温升在前）':'')+'</div><div class="table-wrap"><table>';
    lh+='<tr><th>#</th><th>型号</th>'+(isHV?'<th>温升</th>':'')+'<th>持续'+(isHV?'(主档)':'H')+'('+ux+')</th><th>连续F('+ux+')</th><th>备用40℃('+ux+')</th><th>备用27℃('+ux+')</th><th>PF</th><th>判断</th></tr>';
    for(var i=0;i<list.length;i++){
      var x=list[i];
      var rank=(x.ok?list.filter(function(y,idx){return idx<i&&y.ok;}).length+1:'-');
      lh+='<tr class="'+(x.ok?'ok':'fail')+'"><td>'+(x.ok?rank:'✗')+'</td><td><b>'+x.m+'</b></td>'+(isHV?'<td><span class="badge">'+x.grade+'</span></td>':'')+'<td>'+x.ch+'</td><td>'+x.cl+'</td><td>'+x.s40+'</td><td>'+x.st+'</td><td>'+x.pf+'</td><td>'+(x.ok?'✅':'❌')+'</td></tr>';
    }
    lh+='</table></div>';
  }
  document.getElementById('listDisplay').innerHTML=lh||'<div class="landing"><p>暂无可选电机</p></div>';
}

function toggleStep(el){
  el.classList.toggle('open');
  var body=el.nextElementSibling;
  if(body)body.classList.toggle('open');
}

// 品牌数据文件列表：每个品牌独立文件
var BRAND_FILES = {
  'leroysomer': 'leroysomer.json',
  'talson': 'talson.json',
  'TAL-A46/A473/A49': 'tal-a46.json',
  '斯坦福': 'stanford.json',
  '利莱森玛 LSA 中高压': 'leroysomer-hv.json'
};

function loadBrandData(callback){
  var brands=Object.keys(BRAND_FILES);
  var loaded=0;
  ALL_DATA={};
  for(var i=0;i<brands.length;i++){
    (function(b){
      fetch(BRAND_FILES[b]).then(function(r){return r.json();}).then(function(d){
        for(var j=0;j<d.length;j++){
          var rec=d[j];
          if(rec.type!=='generator') continue;
          if(!ALL_DATA[b]) ALL_DATA[b]=[];
          ALL_DATA[b].push(rec);
        }
        loaded++;
        if(loaded===brands.length && callback) callback();
      }).catch(function(){
        loaded++;
        if(loaded===brands.length && callback) callback();
      });
    })(brands[i]);
  }
}

function fillBrandDropdown(){
  var brands=Object.keys(ALL_DATA);
  var sel=document.getElementById('genBrand');
  sel.innerHTML='<option value="">请选择品牌</option>';
  for(var i=0;i<brands.length;i++){
    var label=brands[i];
    if(label==='leroysomer')label='利莱森玛 LSA';
    else if(label==='talson')label='TAL A40/A42/A44';
    sel.innerHTML+='<option value="'+brands[i]+'">'+label+'</option>';
  }
}

loadBrandData(function(){
  fillBrandDropdown();
  var sel=document.getElementById('genBrand');
  sel.onchange=onParamChange;
  onParamChange();
});
</script>
