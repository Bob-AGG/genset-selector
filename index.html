<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选型工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333}
.header{background:#1a365d;color:#fff;padding:20px 40px}
.header h1{font-size:22px}
.header p{font-size:13px;opacity:.7;margin-top:4px}
.container{max-width:1200px;margin:0 auto;padding:20px;display:grid;gap:20px;grid-template-columns:1fr 1fr}
.card{background:#fff;border-radius:8px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card h2{font-size:16px;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
.card.full{grid-column:1/-1}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid #e2e8f0}
.tab{padding:10px 24px;cursor:pointer;font-size:14px;border:none;background:none;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:#1a365d}
.tab.active{color:#1a365d;font-weight:700;border-bottom-color:#1a365d}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#4a5568}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1a365d;box-shadow:0 0 0 2px rgba(26,54,93,.2)}
.radio-group{display:flex;gap:16px}
.radio-group label{font-weight:400;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
.radio-group input[type=radio]{width:auto;cursor:pointer}
.btn{background:#1a365d;color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:15px;cursor:pointer;transition:background .2s}
.btn:hover{background:#2a4a7d}
.result-card{border-left:4px solid #e2e8f0}
.result-card.pass{border-left-color:#22c55e}
.result-card.fail{border-left-color:#ef4444}
.result-ok{color:#22c55e;font-weight:700}
.result-fail{color:#ef4444;font-weight:700}
.engine-result{padding:12px 0;border-bottom:1px solid #f0f0f0}
.engine-result:last-child{border-bottom:none}
.engine-model{font-size:16px;font-weight:700}
.engine-power{display:flex;gap:20px;margin-top:6px;font-size:13px}
.engine-power span{background:#f8fafc;padding:2px 8px;border-radius:4px}
.calc-detail{background:#f8fafc;border-radius:6px;padding:12px;margin-top:8px;font-size:13px;line-height:1.6}
.stats{font-size:13px;color:#666;margin-bottom:12px}
@media(max-width:768px){.container{grid-template-columns:1fr}.header{padding:16px}}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #e2e8f0}
th{background:#f8fafc;font-weight:600}
tr:hover{background:#f8fafc}
.tag-turbo{display:inline-block;background:#dbeafe;color:#1e40af;font-size:11px;padding:1px 6px;border-radius:3px}
.tag-na{display:inline-block;background:#fef3c7;color:#92400e;font-size:11px;padding:1px 6px;border-radius:3px}
.rule-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:10px;font-size:12px;line-height:1.7;margin-bottom:12px}
.hidden{display:none}
.ins-label{font-size:12px;color:#666;font-weight:400}
</style>
</head>
<body>

<div class="header">
<h1>🔧 选型工具</h1>
<p>发动机 · 发电机</p>
</div>

<div class="container">

<!-- ===== 左侧：参数输入 ===== -->
<div class="card">
<div class="tabs">
<button class="tab active" onclick="switchTab('engine')" id="tabEngine">🔧 发动机选型</button>
<button class="tab" onclick="switchTab('generator')" id="tabGenerator">⚡ 发电机选型</button>
</div>

<!-- 发动机选型 -->
<div id="engineTab">
<div id="engineRuleDesc" class="rule-box">加载中...</div>
<div class="form-group">
<label>品牌</label>
<select id="engBrand" onchange="onEngBrandChange()">
<option value="dcec">东康 DCEC</option>
<option value="cqc">重庆康明斯 CQCC</option>
</select>
</div>
<div class="form-group">
<label>频率</label>
<select id="engFreq"><option value="50Hz">50 Hz</option><option value="60Hz">60 Hz</option></select>
</div>
<div class="form-group">
<label>额定功率 (kW)</label>
<input type="number" id="engPower" value="400" min="10" max="5000" step="5">
</div>
<div class="form-group">
<label>用途</label>
<div class="radio-group">
<label><input type="radio" name="engPurpose" value="ESP" checked> 备用 (ESP)</label>
<label><input type="radio" name="engPurpose" value="PRP"> 常用 (PRP)</label>
</div>
</div>
<div class="form-group">
<label>安装海拔 (m)</label>
<input type="number" id="engAlt" value="0" min="0" max="5000" step="50">
</div>
<div class="form-group">
<label>环境温度 (°C)</label>
<input type="number" id="engTemp" value="25" min="-10" max="60" step="1">
</div>
<button class="btn" onclick="doEngineSearch()">🔍 查询</button>
</div>

<!-- 发电机选型 -->
<div id="genTab" class="hidden">
<div id="genRuleDesc" class="rule-box">利莱森玛 LSA 发电机修正规则：<br>
🏔 海拔修正（查表）：1000m×1.0→1500m×0.975→2000m×0.949→3000m×0.894<br>
🌡 温度修正（按绝缘等级查表）：H级/F级/B级<br>
⚡ 功率因数修正：PF<0.8 时需降额</div>
<div class="form-group">
<label>频率</label>
<select id="genFreq" onchange="onGenFreqChange()">
<option value="50Hz">50 Hz</option>
<option value="60Hz">60 Hz</option>
</select>
</div>
<div class="form-group">
<label>额定电压</label>
<select id="genWinding">
<optgroup label="50Hz 标准绕组">
<option value="6-380-400-415">6号绕组 380/400/415V</option>
<option value="6-220-440">6号绕组 220/440V</option>
<option value="6-12-380-400-415">6/12号绕组 380/400/415V(可选)</option>
<option value="6-12-220-440">6/12号绕组 220/440V(可选)</option>
</optgroup>
<optgroup label="50Hz 特殊绕组">
<option value="7-415-440">7号绕组 415/440V</option>
<option value="9-500-525">9号绕组 500/525V</option>
<option value="22-23-550">22/23号绕组 550V</option>
<option value="22-23-600">22/23号绕组 600V</option>
<option value="10-52-660-690">10/52号绕组 660/690V</option>
</optgroup>
<optgroup label="60Hz 标准绕组">
<option value="6-380-416">6号绕组 380/416V</option>
<option value="6-440-480">6号绕组 440/480V</option>
</optgroup>
</select>
</div>
<div class="form-group">
<label>额定功率 (kVA)</label>
<input type="number" id="genPower" value="500" min="5" max="5000" step="5">
</div>
<div class="form-group">
<label>用途</label>
<div class="radio-group">
<label><input type="radio" name="genPurpose" value="PRIME" checked> 主用 (PRP)</label>
<label><input type="radio" name="genPurpose" value="STANDBY"> 备用 (ESP) <span class="alt-badge">27°C备用功率</span></label>
</div>
</div>
<div class="form-group">
<label>绝缘等级</label>
<select id="genInsClass">
<option value="H">H 级 (125K)</option>
<option value="F">F 级 (105K)</option>
</select>
</div>
<div class="form-group">
<label>功率因数 (PF)</label>
<select id="genPF">
<option value="0.8">0.8</option>
<option value="0.9">0.9</option>
<option value="1.0">1.0</option>
<option value="0.7">0.7</option>
<option value="0.6">0.6</option>
</select>
</div>
<div class="form-group">
<label>安装海拔 (m)</label>
<input type="number" id="genAlt" value="0" min="0" max="4000" step="100">
</div>
<div class="form-group">
<label>环境温度 (°C)</label>
<input type="number" id="genTemp" value="40" min="0" max="60" step="5">
</div>
<button class="btn" onclick="doGenSearch()">🔍 查询</button>
</div>
</div>

<!-- ===== 右侧：结果 ===== -->
<div class="card" id="resultPanel">
<h2 id="resultTitle">📊 选型结果</h2>
<div id="resultContent"><p style="color:#999;text-align:center;padding:30px 0">输入参数后点击「查询」</p></div>
</div>

<div class="card full" id="debugPanel">
<h2 id="debugTitle">🔎 全部候选</h2>
<div id="debugContent"><p style="color:#999;">查询后显示全部候选</p></div>
</div>

</div>

<script>
let ALL_DATA = [];
let DATA_LOADED = false;
let currentTab = 'engine';

// ===== 发电机修正系数 =====
const GEN_ALT_FACTOR = { 0:1, 1000:1, 1500:0.975, 2000:0.949, 2500:0.922, 3000:0.894, 3500:0.866, 4000:0.837 };
const GEN_TEMP_FACTOR = {
  H: { 25:1.076, 40:1, 45:0.973, 50:0.946, 55:0.918, 60:0.889 },
  F: { 25:1.095, 40:1, 45:0.966, 50:0.931, 55:0.894, 60:0.856 }
};
const GEN_PF_FACTOR = { 0.6:0.86, 0.7:0.93, 0.8:1, 0.9:1, 1.0:1 };

function interpolate(val, dict) {
  const keys = Object.keys(dict).map(Number).sort((a,b)=>a-b);
  if (val <= keys[0]) return dict[keys[0]];
  if (val >= keys[keys.length-1]) return dict[keys[keys.length-1]];
  for (let i = 0; i < keys.length-1; i++) {
    if (val >= keys[i] && val <= keys[i+1]) {
      const t = (val - keys[i]) / (keys[i+1] - keys[i]);
      return dict[keys[i]] + t * (dict[keys[i+1]] - dict[keys[i]]);
    }
  }
  return dict[keys[0]];
}

// ===== Tab 切换 =====
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabEngine').className = tab === 'engine' ? 'tab active' : 'tab';
  document.getElementById('tabGenerator').className = tab === 'generator' ? 'tab active' : 'tab';
  document.getElementById('engineTab').className = tab === 'engine' ? '' : 'hidden';
  document.getElementById('genTab').className = tab === 'generator' ? '' : 'hidden';
}

// 根据频率切换绕组选项
function onGenFreqChange() {
  const freq = document.getElementById('genFreq').value;
  const sel = document.getElementById('genWinding');
  // 遍历所有option，根据optgroup显示/隐藏
  for (let i = 0; i < sel.options.length; i++) {
    const opt = sel.options[i];
    if (opt.parentElement && opt.parentElement.tagName === 'OPTGROUP') {
      if (freq === '50Hz' && opt.parentElement.label.indexOf('60Hz') >= 0) {
        opt.disabled = true;
      } else if (freq === '60Hz' && opt.parentElement.label.indexOf('50Hz') >= 0) {
        opt.disabled = true;
      } else {
        opt.disabled = false;
      }
    }
  }
  // 选中第一个未禁用的
  for (let i = 0; i < sel.options.length; i++) {
    if (!sel.options[i].disabled) {
      sel.selectedIndex = i;
      break;
    }
  }
}

// ===== 发动机修正规则 =====
const BRAND_CONFIG = {
  dcec: {
    name: '东康 DCEC',
    getRule: function(model) {
      if (!/T/i.test(model) && !/^QS/i.test(model)) return null;
      return { altBase:2000, altStep:300, altDrop:0.04, tempBase:40, tempStep:10, tempDrop:0.03, name:'涡轮增压标准' };
    }
  },
  cqc: {
    name: '重庆康明斯 CQCC',
    rules: [
      { match:/^(NT|NTA)/i, rule:{ altBase:1525, altStep:300, altDrop:0.04, tempBase:40, tempStep:11, tempDrop:0.02, name:'NTA855' } },
      { match:/^KTA19/i, rule:{ altBase:1525, altStep:300, altDrop:0.04, tempBase:40, tempStep:11, tempDrop:0.02, name:'KTA19' } },
      { match:/^KTA38/i, rule:{ altBase:1525, altStep:300, altDrop:0.04, tempBase:40, tempStep:11, tempDrop:0.02, name:'KTA38' } },
      { match:/^K50/i, rule:{ altBase:915, altStep:300, altDrop:0.04, tempBase:40, tempStep:11, tempDrop:0.16, name:'KTA50' } }
    ],
    getRule(model) {
      for (const r of this.rules) { if (r.match.test(model)) return r.rule; }
      return null;
    }
  }
};

function calcEngCorrection(brand, model, alt, temp) {
  const cfg = BRAND_CONFIG[brand];
  const rule = cfg.getRule(model);
  if (!rule) return { total:1, altFactor:1, tempFactor:1, hasRule:false, altDesc:'无修正', tempDesc:'无修正' };

  let af = 1, tf = 1;
  if (alt > rule.altBase) {
    const over = alt - rule.altBase;
    const steps = Math.floor(over / rule.altStep);
    for (let i = 0; i < steps; i++) af *= (1 - rule.altDrop);
    const rem = over % rule.altStep;
    if (rem > 0) af *= (1 - rule.altDrop * rem / rule.altStep);
    af = Math.round(af * 1000) / 1000;
  }
  if (temp > rule.tempBase) {
    const over = temp - rule.tempBase;
    const steps = Math.floor(over / rule.tempStep);
    for (let i = 0; i < steps; i++) tf *= (1 - rule.tempDrop);
    const rem = over % rule.tempStep;
    if (rem > 0) tf *= (1 - rule.tempDrop * rem / rule.tempStep);
    tf = Math.round(tf * 1000) / 1000;
  }
  const total = Math.round(af * tf * 1000) / 1000;
  let altDesc = alt <= rule.altBase ? '海拔 ≤' + rule.altBase + 'm，无需修正' : '超过' + rule.altBase + 'm，每' + rule.altStep + 'm降' + (rule.altDrop*100) + '%，降幅 ' + Math.round((1-af)*1000)/10 + '%';
  let tempDesc = temp <= rule.tempBase ? '温度 ≤' + rule.tempBase + '℃，无需修正' : '超过' + rule.tempBase + '℃，每' + rule.tempStep + '℃降' + (rule.tempDrop*100) + '%，降幅 ' + Math.round((1-tf)*1000)/10 + '%';
  return { total, altFactor:af, tempFactor:tf, hasRule:true, altDesc, tempDesc, ruleName:rule.name };
}

function onEngBrandChange() {
  const brand = document.getElementById('engBrand').value;
  const cfg = BRAND_CONFIG[brand];
  let h = '<b>' + cfg.name + '</b> 修正规则：<br>';
  if (brand === 'dcec') h += '• 涡轮增压(T/QS)：海拔>2000m每300m降4%，温度>40℃每10℃降3%<br>• 自然吸气(无T)：不修正';
  else h += '• 有规则：NTA855、KTA19、KTA38、KTA50<br>• 无规则：海拔<1000m显示，≥1000m隐藏';
  document.getElementById('engineRuleDesc').innerHTML = h;
}

// ===== 发电机修正 =====
function calcGenCorrection(alt, temp, insClass, pf) {
  const af = interpolate(alt, GEN_ALT_FACTOR);
  const tempDict = GEN_TEMP_FACTOR[insClass] || GEN_TEMP_FACTOR.H;
  const tf = interpolate(temp, tempDict);
  const pff = GEN_PF_FACTOR[pf] || 1;
  const total = Math.round(af * tf * pff * 1000) / 1000;
  let altDesc = alt <= 1000 ? '海拔 ≤1000m，无需修正' : '海拔修正系数 ×' + af;
  let tempDesc = temp <= 40 ? '温度 ≤40℃，无需修正' : '温度(' + insClass + '级)修正系数 ×' + tf;
  let pfDesc = pf >= 0.8 ? 'PF≥0.8，无需修正' : 'PF=' + pf + ' 修正系数 ×' + pff;
  return { total, altFactor:af, tempFactor:tf, pfFactor:pff, altDesc, tempDesc, pfDesc };
}

// ===== 数据加载 =====
async function loadData() {
  try {
    const r = await fetch('engines.json');
    ALL_DATA = await r.json();
    DATA_LOADED = true;
    console.log('Loaded', ALL_DATA.length, 'items');
    onEngBrandChange();
  } catch(e) { console.warn('Data load failed'); }
}

// ===== 发动机查询 =====
function doEngineSearch() {
  const power = parseFloat(document.getElementById('engPower').value);
  const freq = document.getElementById('engFreq').value;
  const purpose = document.querySelector('input[name="engPurpose"]:checked').value;
  const alt = parseFloat(document.getElementById('engAlt').value);
  const temp = parseFloat(document.getElementById('engTemp').value);
  const brand = document.getElementById('engBrand').value;
  if (!power || power < 1) { alert('请输入有效功率'); return; }

  const filtered = ALL_DATA.filter(e => e.type === 'engine' && e.brand === brand && e.frequency === freq);
  const candidates = [];

  for (const eng of filtered) {
    const corr = calcEngCorrection(brand, eng.model, alt, temp);
    if (brand === 'cqc' && alt >= 1000 && !corr.hasRule) continue;
    let rated = 0;
    if (purpose === 'ESP') rated = eng.esp_kWe ? eng.esp_kWe : (eng.esp_kVA ? eng.esp_kVA * 0.8 : 0);
    else rated = eng.prp_kWe ? eng.prp_kWe : (eng.prp_kVA ? eng.prp_kVA * 0.8 : 0);
    if (rated <= 0) continue;
    const cp = Math.round(rated * corr.total * 10) / 10;
    candidates.push({ ...eng, ratedPower:Math.round(rated), correctedPower:cp, meets:cp >= power, corr });
  }
  candidates.sort((a,b) => { if(a.meets&&!b.meets) return -1; if(!a.meets&&b.meets) return 1; return a.correctedPower - b.correctedPower; });
  displayEngineResults(candidates, power);
}

function displayEngineResults(candidates, reqPower) {
  const pass = candidates.filter(c => c.meets);
  const rc = document.getElementById('resultContent');
  const dc = document.getElementById('debugContent');
  document.getElementById('resultTitle').textContent = '📊 发动机选型结果';

  if (pass.length === 0) {
    const c = candidates[0]?.corr || { total:1, altDesc:'', tempDesc:'' };
    let h = '<div class="result-card fail" style="padding:16px"><div class="result-fail">❌ 未找到</div>';
    if (candidates.length === 0) h += '<p style="margin-top:10px;color:#666">无可用数据</p>';
    else h += '<div class="calc-detail">所需修正后功率 ≥ ' + Math.ceil(reqPower / c.total) + 'kW<br>🏔 ' + c.altDesc + '<br>🌡 ' + c.tempDesc + '<br>综合: ×' + c.total + '</div>';
    h += '</div>';
    rc.innerHTML = h;
  } else {
    const top = pass.slice(0, 5);
    const b = top[0], c = b.corr;
    let h = '<div class="result-card pass" style="padding:12px"><div class="result-ok" style="font-size:18px">✅ ' + pass.length + ' 个可用</div>';
    if (c.hasRule && c.total !== 1) {
      h += '<div class="calc-detail"><b>📐 修正计算</b><br>' + c.ruleName + '<br>🏔 ' + c.altDesc + '<br>🌡 ' + c.tempDesc + '<br><strong>综合: ×' + c.total + '</strong></div>';
    } else {
      h += '<div class="calc-detail">无需修正 — 按额定功率选型</div>';
    }
    h += '<div class="engine-result" style="background:#f0fdf4;border-radius:6px;padding:10px;margin-top:10px"><div class="engine-model">🏆 ' + b.model + '</div>' +
      '<div class="engine-power"><span>ESP: ' + (b.esp_kWe?b.esp_kWe+'kW':(b.esp_kVA?Math.round(b.esp_kVA*0.8)+'kW':'—')) + ' / ' + (b.esp_kVA?b.esp_kVA+'kVA':'—') + '</span>' +
      '<span>PRP: ' + (b.prp_kWe?b.prp_kWe+'kW':(b.prp_kVA?Math.round(b.prp_kVA*0.8)+'kW':'—')) + ' / ' + (b.prp_kVA?b.prp_kVA+'kVA':'—') + '</span></div>' +
      '<div class="engine-power" style="font-weight:600"><span class="result-ok">修正后: ' + b.correctedPower + 'kW ✅</span></div></div>';
    if (top.length > 1) {
      h += '<div style="margin-top:12px"><b>其他:</b></div>';
      for (let i=1; i<top.length; i++) {
        const e=top[i], ec=e.corr;
        h += '<div class="engine-result"><div class="engine-model">' + e.model + '</div><div class="engine-power"><span>修正后: ' + e.correctedPower + 'kW</span><span>' + (ec.total!==1?'×'+ec.total:'无修正') + '</span></div></div>';
      }
    }
    h += '</div>';
    rc.innerHTML = h;
  }

  let d = '<div class="stats">共' + candidates.length + '个，' + pass.length + '个满足</div>';
  d += '<table><tr><th>型号</th><th>系列</th><th>ESP(kW)</th><th>PRP(kW)</th><th>修正后</th><th>系数</th><th>结果</th></tr>';
  for (const e of candidates) {
    const ec = e.corr, cls = e.meets ? ' style="background:#f0fdf4"' : '';
    d += '<tr' + cls + '><td><b>' + e.model + '</b></td><td>' + (e.series||'-') + '</td>' +
      '<td>' + (e.esp_kWe ? e.esp_kWe : (e.esp_kVA ? Math.round(e.esp_kVA*0.8) : '-')) + '</td>' +
      '<td>' + (e.prp_kWe ? e.prp_kWe : (e.prp_kVA ? Math.round(e.prp_kVA*0.8) : '-')) + '</td>' +
      '<td><b>' + e.correctedPower + '</b></td><td>' + (ec.total !== 1 ? '×' + ec.total : '1.0') + '</td><td>' + (e.meets ? '✅' : '❌') + '</td></tr>';
  }
  d += '</table>';
  dc.innerHTML = d;
}

// ===== 发电机查询 =====
function doGenSearch() {
  const power = parseFloat(document.getElementById('genPower').value);
  const freq = document.getElementById('genFreq').value;
  const winding = document.getElementById('genWinding').value;
  const purpose = document.querySelector('input[name="genPurpose"]:checked').value;
  const insClass = document.getElementById('genInsClass').value;
  const pf = parseFloat(document.getElementById('genPF').value);
  const alt = parseFloat(document.getElementById('genAlt').value);
  const temp = parseFloat(document.getElementById('genTemp').value);
  if (!power || power < 1) { alert('请输入有效功率'); return; }

  const filtered = ALL_DATA.filter(e => e.type === 'generator' && e.frequency === freq && e.winding_code === winding);
  const corr = calcGenCorrection(alt, temp, insClass, pf);
  const candidates = [];

  for (const gen of filtered) {
    let rated = 0;
    if (purpose === 'PRIME') rated = gen.cont_h_kVA;
    else rated = gen.stdby_27c_kVA;  // 备用用27°C
    if (!rated || rated <= 0) continue;
    const cp = Math.round(rated * corr.total * 10) / 10;
    candidates.push({ ...gen, ratedPower:rated, correctedPower:cp, meets:cp >= power, corr });
  }
  candidates.sort((a,b) => { if(a.meets&&!b.meets) return -1; if(!a.meets&&b.meets) return 1; return a.correctedPower - b.correctedPower; });
  displayGenResults(candidates, power, corr);
}

function displayGenResults(candidates, reqPower, corr) {
  const pass = candidates.filter(c => c.meets);
  const rc = document.getElementById('resultContent');
  const dc = document.getElementById('debugContent');
  document.getElementById('resultTitle').textContent = '📊 发电机选型结果';

  if (pass.length === 0) {
    let h = '<div class="result-card fail" style="padding:16px"><div class="result-fail">❌ 未找到</div>';
    if (candidates.length > 0) {
      h += '<div class="calc-detail"><b>📐 修正计算</b><br>🏔 ' + corr.altDesc + '<br>🌡 ' + corr.tempDesc + '<br>⚡ ' + corr.pfDesc + '<br><strong>综合修正: ×' + corr.total + '</strong></div>';
    }
    h += '</div>';
    rc.innerHTML = h;
  } else {
    const top = pass.slice(0, 5);
    const b = top[0];
    let h = '<div class="result-card pass" style="padding:12px"><div class="result-ok" style="font-size:18px">✅ ' + pass.length + ' 个可用</div>' +
      '<div class="calc-detail"><b>📐 修正计算</b><br>🏔 ' + corr.altDesc + '<br>🌡 ' + corr.tempDesc + '<br>⚡ ' + corr.pfDesc + '<br><strong>综合修正: ×' + corr.total + '</strong></div>' +
      '<div class="engine-result" style="background:#f0fdf4;border-radius:6px;padding:10px;margin-top:10px"><div class="engine-model">🏆 ' + b.model + '</div>' +
      '<div class="engine-power"><span>连续(H级): ' + b.cont_h_kVA + 'kVA</span><span>连续(F级): ' + b.cont_f_kVA + 'kVA</span><span>备用27°C: ' + b.stdby_27c_kVA + 'kVA</span></div>' +
      '<div class="engine-power" style="font-weight:600"><span class="result-ok">修正后: ' + b.correctedPower + 'kVA ≥ ' + reqPower + 'kVA ✅</span></div></div>';
    if (top.length > 1) {
      h += '<div style="margin-top:12px"><b>其他:</b></div>';
      for (let i=1; i<top.length; i++) {
        const e = top[i];
        h += '<div class="engine-result"><div class="engine-model">' + e.model + '</div><div class="engine-power"><span>修正后: ' + e.correctedPower + 'kVA</span><span>备用27°C: ' + e.stdby_27c_kVA + 'kVA</span><span>×' + corr.total + '</span></div></div>';
      }
    }
    h += '</div>';
    rc.innerHTML = h;
  }

  let d = '<div class="stats">共' + candidates.length + '个，' + pass.length + '个满足 | 综合修正: ×' + corr.total + '</div>';
  d += '<table><tr><th>型号</th><th>励磁</th><th>连续H(kVA)</th><th>连续F(kVA)</th><th>备用27°C</th><th>修正后</th><th>结果</th></tr>';
  for (const e of candidates) {
    const cls = e.meets ? ' style="background:#f0fdf4"' : '';
    const excLabel = e.exc === 'C' ? 'AREP' : 'SHUNT/AREP';
    d += '<tr' + cls + '><td><b>' + e.model + '</b></td><td>' + excLabel + '</td>' +
      '<td>' + e.cont_h_kVA + '</td><td>' + e.cont_f_kVA + '</td><td>' + e.stdby_27c_kVA + '</td>' +
      '<td><b>' + e.correctedPower + '</b></td><td>' + (e.meets ? '✅' : '❌') + '</td></tr>';
  }
  d += '</table>';
  dc.innerHTML = d;
}

loadData();
</script>
