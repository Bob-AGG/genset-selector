<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选型工具 - 东康发动机</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }

  .header { background: #1a365d; color: #fff; padding: 20px 40px; }
  .header h1 { font-size: 22px; }
  .header p { font-size: 13px; opacity: .7; margin-top: 4px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }

  .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card h2 { font-size: 16px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
  .card.full { grid-column: 1 / -1; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #4a5568; }
  .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a365d; box-shadow: 0 0 0 2px rgba(26,54,93,.2); }

  .radio-group { display: flex; gap: 16px; }
  .radio-group label { font-weight: 400; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .radio-group input[type="radio"] { width: auto; cursor: pointer; }

  .btn { background: #1a365d; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 15px; cursor: pointer; transition: background .2s; }
  .btn:hover { background: #2a4a7d; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .result-card { border-left: 4px solid #e2e8f0; }
  .result-card.pass { border-left-color: #22c55e; }
  .result-card.fail { border-left-color: #ef4444; }

  .result-ok { color: #22c55e; font-weight: 700; }
  .result-fail { color: #ef4444; font-weight: 700; }
  .result-warn { color: #f59e0b; font-weight: 700; }

  .engine-result { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .engine-result:last-child { border-bottom: none; }
  .engine-model { font-size: 16px; font-weight: 700; }
  .engine-spec { font-size: 13px; color: #666; margin-top: 2px; }
  .engine-power { display: flex; gap: 20px; margin-top: 6px; font-size: 13px; }
  .engine-power span { background: #f8fafc; padding: 2px 8px; border-radius: 4px; }

  .calc-detail { background: #f8fafc; border-radius: 6px; padding: 12px; margin-top: 8px; font-size: 13px; line-height: 1.6; }
  .calc-detail code { background: #e2e8f0; padding: 1px 5px; border-radius: 3px; font-size: 12px; }

  .stats { font-size: 13px; color: #666; margin-bottom: 12px; }
  .brand-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .brand-tab { padding: 6px 16px; border-radius: 20px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 13px; }
  .brand-tab.active { background: #1a365d; color: #fff; border-color: #1a365d; }

  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .header { padding: 16px; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  th { background: #f8fafc; font-weight: 600; }
  tr:hover { background: #f8fafc; }
  .tag-turbo { display:inline-block; background:#dbeafe; color:#1e40af; font-size:11px; padding:1px 6px; border-radius:3px; }
  .tag-na { display:inline-block; background:#fef3c7; color:#92400e; font-size:11px; padding:1px 6px; border-radius:3px; }
  .rule-box { background:#f0f9ff; border:1px solid #bae6fd; border-radius:6px; padding:10px; font-size:12px; line-height:1.7; margin-bottom:12px; }
</style>
</head>
<body>

<div class="header">
  <h1>🔧 发电机组选型工具</h1>
  <p>东康动力 · v1.0 · DCEC 官方海拔/温度修正规则</p>
</div>

<div class="container">
  <div class="card">
    <h2>📋 选型参数</h2>
    <div class="rule-box">
      <b>修正规则说明：</b><br>
      🏔 海拔 ≤2000m 不修正，超过后每300m降4%<br>
      🌡️ 温度 ≤40℃ 不修正，超过后每10℃降3%<br>
      ⚠️ 自然吸气机型（型号不含 T）不执行修正
    </div>
    <div class="form-group">
      <label>品牌</label>
      <select id="brand">
        <option value="dcec">东康 DCEC (Cummins)</option>
      </select>
    </div>
    <div class="form-group">
      <label>频率</label>
      <select id="frequency">
        <option value="50Hz">50 Hz</option>
        <option value="60Hz">60 Hz</option>
      </select>
    </div>
    <div class="form-group">
      <label>额定功率 (kW)</label>
      <input type="number" id="power" value="400" min="10" max="2000" step="5">
    </div>
    <div class="form-group">
      <label>用途</label>
      <div class="radio-group">
        <label><input type="radio" name="purpose" value="ESP" checked> 备用 (ESP)</label>
        <label><input type="radio" name="purpose" value="PRP"> 常用 (PRP)</label>
      </div>
    </div>
    <div class="form-group">
      <label>安装海拔 (m)</label>
      <input type="number" id="altitude" value="0" min="0" max="5000" step="50">
    </div>
    <div class="form-group">
      <label>环境温度 (°C)</label>
      <input type="number" id="temperature" value="25" min="-10" max="60" step="1">
    </div>
    <button class="btn" onclick="doSearch()">🔍 查询选型</button>
  </div>

  <div class="card" id="resultPanel">
    <h2>📊 选型结果</h2>
    <div id="resultContent">
      <p style="color:#999;text-align:center;padding:30px 0">输入参数后点击「查询选型」</p>
    </div>
  </div>

  <div class="card full" id="debugPanel">
    <h2>🔎 全部候选型号</h2>
    <div id="debugContent">
      <p style="color:#999;">查询后显示所有候选及计算详情</p>
    </div>
  </div>
</div>

<script>
const ENGINE_DATA = {"dcec":{"name":"东康 DCEC","engines":[]}};

// DCEC 官方修正规则
// 海拔：≤2000m 不修正，超过后每300m降4%
// 温度：≤40℃ 不修正，超过后每10℃降3%
// 自然吸气（型号不含 T）不做任何修正

function hasTurbo(model) {
  return /[Tt]/.test(model);
}

function calcAltitudeFactor(altitude) {
  if (altitude <= 2000) return 1.000;
  const over = altitude - 2000;
  const steps = Math.floor(over / 300);
  // 每300m降4%，阶梯式递减
  let factor = 1.0;
  for (let i = 0; i < steps; i++) {
    factor *= (1 - 0.04);
  }
  // 余数按比例折算
  const remainder = over % 300;
  if (remainder > 0) {
    factor *= (1 - 0.04 * remainder / 300);
  }
  return Math.round(factor * 1000) / 1000;
}

function calcTemperatureFactor(temp) {
  if (temp <= 40) return 1.000;
  const over = temp - 40;
  const steps = Math.floor(over / 10);
  let factor = 1.0;
  for (let i = 0; i < steps; i++) {
    factor *= (1 - 0.03);
  }
  const remainder = over % 10;
  if (remainder > 0) {
    factor *= (1 - 0.03 * remainder / 10);
  }
  return Math.round(factor * 1000) / 1000;
}

function calcCorrection(model, altitude, temperature) {
  if (!hasTurbo(model)) {
    // 自然吸气不修正
    return {
      altFactor: 1.000,
      tempFactor: 1.000,
      total: 1.000,
      turbo: false,
      altDesc: '自然吸气机型，不执行海拔修正',
      tempDesc: '自然吸气机型，不执行温度修正'
    };
  }

  const altFactor = calcAltitudeFactor(altitude);
  const tempFactor = calcTemperatureFactor(temperature);
  const total = Math.round(altFactor * tempFactor * 1000) / 1000;

  let altDesc, tempDesc;
  if (altitude <= 2000) {
    altDesc = '海拔 ≤2000m，无需修正';
  } else {
    const over = altitude - 2000;
    altDesc = '超过2000m，每300m降4%，降幅 ' + (Math.round((1 - altFactor) * 1000) / 10) + '%';
  }

  if (temperature <= 40) {
    tempDesc = '温度 ≤40℃，无需修正';
  } else {
    const over = temperature - 40;
    tempDesc = '超过40℃，每10℃降3%，降幅 ' + (Math.round((1 - tempFactor) * 1000) / 10) + '%';
  }

  return { altFactor, tempFactor, total, turbo: true, altDesc, tempDesc };
}

async function loadData() {
  try {
    const resp = await fetch('dcec_engines.json');
    const data = await resp.json();
    ENGINE_DATA.dcec.engines = data;
    console.log('Loaded', data.length, 'engines');
  } catch(e) {
    console.warn('Failed to load engine data');
  }
}

function doSearch() {
  const power = parseFloat(document.getElementById('power').value);
  const freq = document.getElementById('frequency').value;
  const purpose = document.querySelector('input[name="purpose"]:checked').value;
  const altitude = parseFloat(document.getElementById('altitude').value);
  const temperature = parseFloat(document.getElementById('temperature').value);

  if (!power || power < 1) { alert('请输入有效功率'); return; }

  const engines = ENGINE_DATA.dcec.engines;
  const candidates = [];

  for (const eng of engines) {
    if (eng.frequency !== freq) continue;

    let ratedPower = 0;
    if (purpose === 'ESP') {
      ratedPower = eng.esp_kWe || (eng.esp_kVA ? eng.esp_kVA * 0.8 : 0);
    } else {
      ratedPower = eng.prp_kWe || (eng.prp_kVA ? eng.prp_kVA * 0.8 : 0);
    }
    if (ratedPower <= 0) continue;

    const correction = calcCorrection(eng.model, altitude, temperature);
    const correctedPower = ratedPower * correction.total;

    candidates.push({
      ...eng,
      ratedPower: Math.round(ratedPower),
      correctedPower: Math.round(correctedPower * 10) / 10,
      meets: correctedPower >= power,
      correction,
      turbo: hasTurbo(eng.model)
    });
  }

  candidates.sort((a, b) => {
    if (a.meets && !b.meets) return -1;
    if (!a.meets && b.meets) return 1;
    return a.correctedPower - b.correctedPower;
  });

  displayResults(candidates, power, purpose, altitude, temperature);
}

function displayResults(candidates, reqPower, purpose, altitude, temperature) {
  const passing = candidates.filter(c => c.meets);
  const resultDiv = document.getElementById('resultContent');
  const debugDiv = document.getElementById('debugContent');

  if (passing.length === 0) {
    const sampleCorr = candidates.length > 0 ? candidates[0].correction : { altFactor:1, tempFactor:1, total:1, turbo:true, altDesc:'', tempDesc:'' };
    let html = '<div class="result-card fail" style="padding:16px">' +
      '<div class="result-fail">❌ 未找到满足条件的型号</div>';

    if (candidates.length === 0) {
      html += '<p style="margin-top:10px;color:#666">当前频率下无可用发动机数据</p>';
    } else {
      const minRequired = Math.ceil(reqPower / sampleCorr.total);
      html += '<div class="calc-detail">原始需求: ' + reqPower + 'kW ' + purpose + '<br>' +
        '— 修正计算说明 —<br>' +
        '海拔: ' + sampleCorr.altDesc + '<br>' +
        '温度: ' + sampleCorr.tempDesc + '<br>' +
        '<strong>综合系数: ×' + sampleCorr.total + '</strong><br>' +
        '<strong>所需额定功率 ≥ ' + minRequired + 'kW</strong></div>';
    }
    html += '</div>';
    resultDiv.innerHTML = html;
  } else {
    const top = passing.slice(0, 5);
    const best = top[0];
    const c = best.correction;
    const minRequired = Math.ceil(reqPower / c.total);

    let html = '<div class="result-card pass" style="padding:12px">' +
      '<div class="result-ok" style="font-size:18px">✅ 推荐 ' + passing.length + ' 个可用型号</div>' +
      '<div class="calc-detail" style="margin-top:10px">' +
      '<b>📐 修正计算过程</b><br>' +
      '原始需求: ' + reqPower + 'kW ' + purpose + '<br>' +
      (best.turbo
        ? '🏔 ' + c.altDesc + '<br>🌡️ ' + c.tempDesc +
          '<br><strong>综合修正系数: ×' + c.total + '</strong>' +
          '<br>所需额定功率 ≥ ' + minRequired + 'kW'
        : '⚠️ 自然吸气机型（型号不含 T），不做功率修正<br>按额定功率直接选型') +
      '</div>' +
      '<div class="engine-result" style="background:#f0fdf4;border-radius:6px;padding:10px;margin-top:10px">' +
      '<div class="engine-model">🏆 最佳推荐: ' + best.model + ' ' +
        (best.turbo ? '<span class="tag-turbo">Turbo</span>' : '<span class="tag-na">NA</span>') +
      '</div>' +
      '<div class="engine-power"><span>📦 ' + best.config + '</span><span>⚖️ ' + (best.dry_weight_kg || '-') + 'kg</span></div>' +
      '<div class="engine-power"><span>ESP: ' + (best.esp_kWe || Math.round(best.esp_kVA*0.8) || '-') + 'kW / ' + (best.esp_kVA || '-') + 'kVA</span>' +
      '<span>PRP: ' + (best.prp_kWe || Math.round(best.prp_kVA*0.8) || '-') + 'kW / ' + (best.prp_kVA || '-') + 'kVA</span></div>' +
      '<div class="engine-power" style="font-weight:600"><span class="result-ok">修正后: ' + best.correctedPower + 'kW ≥ ' + reqPower + 'kW ✅</span></div></div>';

    if (top.length > 1) {
      html += '<div style="margin-top:12px"><strong>其他可用型号:</strong></div>';
      for (let i = 1; i < top.length; i++) {
        const e = top[i];
        html += '<div class="engine-result"><div class="engine-model">' + e.model + ' ' +
          (e.turbo ? '<span class="tag-turbo">Turbo</span>' : '<span class="tag-na">NA</span>') +
          '</div>' +
          '<div class="engine-power"><span>修正后: ' + e.correctedPower + 'kW</span><span>额定: ' + e.ratedPower + 'kW</span>' +
          (e.correction.total !== 1 ? '<span>系数: ×' + e.correction.total + '</span>' : '<span>无修正</span>') +
          '</div></div>';
      }
    }
    html += '</div>';
    resultDiv.innerHTML = html;
  }

  let dbg = '<div class="stats">共 ' + candidates.length + ' 个型号，' + passing.length + ' 个满足</div>';
  dbg += '<table><tr><th>型号</th><th>类型</th><th>配置</th><th>ESP(kW)</th><th>PRP(kW)</th><th>修正后(kW)</th><th>系数</th><th>结果</th><th>尺寸(mm)</th><th>重量(kg)</th></tr>';
  for (const e of candidates) {
    const cls = e.meets ? ' style="background:#f0fdf4"' : '';
    dbg += '<tr' + cls + '><td><b>' + e.model + '</b></td>' +
      '<td>' + (e.turbo ? '<span class="tag-turbo">T</span>' : '<span class="tag-na">NA</span>') + '</td>' +
      '<td>' + e.config + '</td>'
      '<td>' + (e.esp_kWe || Math.round(e.esp_kVA*0.8) || '-') + '</td>' +
      '<td>' + (e.prp_kWe || Math.round(e.prp_kVA*0.8) || '-') + '</td>' +
      '<td><b>' + e.correctedPower + '</b></td>' +
      '<td>' + (e.correction.total !== 1 ? '×' + e.correction.total : '1.000') + '</td>' +
      '<td>' + (e.meets ? '✅' : '❌') + '</td>' +
      '<td>' + (e.length_mm||'-') + '×' + (e.width_mm||'-') + '×' + (e.height_mm||'-') + '</td>' +
      '<td>' + (e.dry_weight_kg||'-') + '</td></tr>';
  }
  dbg += '</table>';
  debugDiv.innerHTML = dbg;
}

loadData();
</script>
</body>
</html>
